map $sent_http_content_type $cache_control {
    default                     "no-cache";
    ~*^image/                   "public, max-age=2592000, immutable";
    ~*^font/                    "public, max-age=2592000, immutable";
    application/javascript      "public, max-age=31536000, immutable";
    text/css                    "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    # React build is the public root
    root /var/www/html/frontend/dist;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    client_max_body_size 20m;
    add_header Cache-Control $cache_control always;

    # ---- API: /api/* is handled by PHP-FPM (public/api.php) ----
    location /api/ {
        rewrite ^/api/?(.*)$ /api.php last;
    }
    location = /api {
        rewrite ^ /api.php last;
    }

    # User-uploaded media (served directly from public/uploads/)
    location /uploads/ {
        alias /var/www/html/public/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Single PHP front controller for the API
    location = /api.php {
        internal;
        fastcgi_pass app:9000;
        fastcgi_index api.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/api.php;
        fastcgi_param SCRIPT_NAME     /api.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
    }

    # Direct one-off PHP scripts in /public (e.g. /test_db.php)
    location ~ ^/(test_db|index)\.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
    }

    # ---- React SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
