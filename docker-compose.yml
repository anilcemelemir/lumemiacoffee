name: lumemiacoffee

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lumemia_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-lumemia}
      DB_USER: ${DB_USER:-lumemia}
      DB_PASSWORD: ${DB_PASSWORD:-lumemia_secret}
      JWT_SECRET: ${JWT_SECRET:-please-set-jwt-secret-in-env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    container_name: lumemia_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - backend

  db:
    image: mariadb:11.4
    container_name: lumemia_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-lumemia}
      MARIADB_USER: ${DB_USER:-lumemia}
      MARIADB_PASSWORD: ${DB_PASSWORD:-lumemia_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  pma:
    image: phpmyadmin:5
    container_name: lumemia_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
